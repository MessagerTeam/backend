name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Messenger.sln

      - name: Build
        run: dotnet build Messenger.sln --no-restore -c Release

      - name: Format check
        run: dotnet format Messenger.sln --verify-no-changes --no-restore

      - name: Test
        run: dotnet test Messenger.sln --no-build -c Release
