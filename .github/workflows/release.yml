name: Backend Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

concurrency:
  group: backend-release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  images:
    name: Build and push ${{ matrix.image }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend-gateway
            project: Messenger.Gateway
          - image: backend-user
            project: Messenger.User
          - image: backend-chat
            project: Messenger.Chat
          - image: backend-realtime
            project: Messenger.Realtime

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute lowercase image owner
        id: vars
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=tag
            type=sha,format=long
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/${{ matrix.project }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  release:
    name: Publish deploy artifact
    needs: images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build deployment bundle
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME}"
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          BUNDLE="dist/backend-deploy-${VERSION}"

          # Собираем deploy-набор: только конфиги и ссылки на готовые образы.
          mkdir -p "${BUNDLE}"

          cp deploy/docker-compose.yml "${BUNDLE}/docker-compose.yml"
          cp deploy/init-db.sh "${BUNDLE}/init-db.sh"
          cp deploy/README.md "${BUNDLE}/README.md"
          cp deploy/.env.example "${BUNDLE}/.env.example"

          # Подставляем версию релиза в шаблон .env, чтобы infra не выбирала тег вручную.
          sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${VERSION}/" "${BUNDLE}/.env.example"

          printf '%s\n' "${VERSION}" > "${BUNDLE}/VERSION"

          # Фиксируем точные образы этого релиза.
          {
            printf 'ghcr.io/%s/backend-gateway:%s\n' "${OWNER}" "${VERSION}"
            printf 'ghcr.io/%s/backend-user:%s\n' "${OWNER}" "${VERSION}"
            printf 'ghcr.io/%s/backend-chat:%s\n' "${OWNER}" "${VERSION}"
            printf 'ghcr.io/%s/backend-realtime:%s\n' "${OWNER}" "${VERSION}"
          } > "${BUNDLE}/images.txt"

          # Упаковываем в zip для GitHub Release.
          cd dist
          zip -r "backend-deploy-${VERSION}.zip" "backend-deploy-${VERSION}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/backend-deploy-${{ github.ref_name }}.zip
