name: Backend Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

concurrency:
  group: backend-release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  images:
    name: Build and push ${{ matrix.image }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend-gateway
            project: Messenger.Gateway
          - image: backend-user
            project: Messenger.User
          - image: backend-chat
            project: Messenger.Chat
          - image: backend-realtime
            project: Messenger.Realtime

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute lowercase image owner
        id: vars
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=tag
            type=sha,format=long
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/${{ matrix.project }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  release:
    name: Publish deploy artifact
    needs: images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build deployment bundle
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME}"
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          BUNDLE="dist/backend-deploy-${VERSION}"

          # Собираем deploy-набор: только конфиги и ссылки на готовые образы.
          mkdir -p "${BUNDLE}"

          cp deploy/docker-compose.yml "${BUNDLE}/docker-compose.yml"
          cp deploy/init-db.sh "${BUNDLE}/init-db.sh"
          cp deploy/README.md "${BUNDLE}/README.md"
          cp deploy/.env.example "${BUNDLE}/.env.example"

          # Подставляем версию релиза в шаблон .env, чтобы infra не выбирала тег вручную.
          sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${VERSION}/" "${BUNDLE}/.env.example"

          printf '%s\n' "${VERSION}" > "${BUNDLE}/VERSION"

          # Фиксируем точные образы этого релиза.
          {
            printf 'ghcr.io/%s/backend-gateway:%s\n' "${OWNER}" "${VERSION}"
            printf 'ghcr.io/%s/backend-user:%s\n' "${OWNER}" "${VERSION}"
            printf 'ghcr.io/%s/backend-chat:%s\n' "${OWNER}" "${VERSION}"
            printf 'ghcr.io/%s/backend-realtime:%s\n' "${OWNER}" "${VERSION}"
          } > "${BUNDLE}/images.txt"

          # Упаковываем в zip для GitHub Release.
          cd dist
          zip -r "backend-deploy-${VERSION}.zip" "backend-deploy-${VERSION}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/backend-deploy-${{ github.ref_name }}.zip
          
      - name: Notify infra about new release
        env:
          TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          VERSION: ${{ github.ref_name }}
          INFRA_REPOSITORY: MessagerTeam/infra
          API_VERSION: "2026-03-10"
        shell: bash
        run: |
          set -euo pipefail

          echo "Dispatch step revision: diagnostics-v2"

          if [[ -z "$TOKEN" ]]; then
            echo "::error::INFRA_DISPATCH_TOKEN is not configured"
            exit 1
          fi

          if [[ -z "$VERSION" ]]; then
            echo "::error::Release version is empty"
            exit 1
          fi

          TEMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TEMP_DIR"' EXIT

          PAYLOAD_FILE="${TEMP_DIR}/payload.json"
          HEADERS_FILE="${TEMP_DIR}/headers.txt"
          BODY_FILE="${TEMP_DIR}/body.json"

          jq -n \
            --arg version "$VERSION" \
            '{
              event_type: "backend_release",
              client_payload: {
                version: $version
              }
            }' > "$PAYLOAD_FILE"

          echo "Target repository: $INFRA_REPOSITORY"
          echo "Event type: backend_release"
          echo "Release version: $VERSION"
          echo "GitHub API version: $API_VERSION"
          echo "Workflow commit: $GITHUB_SHA"

          echo "::group::Dispatch payload"
          jq . "$PAYLOAD_FILE"
          echo "::endgroup::"

          if HTTP_CODE="$(curl \
            --silent \
            --show-error \
            --location \
            --connect-timeout 15 \
            --max-time 60 \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $TOKEN" \
            --header "X-GitHub-Api-Version: $API_VERSION" \
            --header "Content-Type: application/json" \
            --dump-header "$HEADERS_FILE" \
            --output "$BODY_FILE" \
            --write-out '%{http_code}' \
            "https://api.github.com/repos/${INFRA_REPOSITORY}/dispatches" \
            --data-binary "@${PAYLOAD_FILE}")"; then
            echo "Dispatch HTTP status: $HTTP_CODE"
          else
            CURL_EXIT_CODE=$?
            echo "::error::curl failed before completing the request. Exit code: $CURL_EXIT_CODE"
            exit "$CURL_EXIT_CODE"
          fi

          echo "::group::GitHub API diagnostic response headers"
          grep -Ei \
            '^(HTTP/|x-accepted-github-permissions:|x-github-request-id:|x-github-sso:|x-ratelimit-remaining:|x-ratelimit-reset:|retry-after:)' \
            "$HEADERS_FILE" || true
          echo "::endgroup::"

          if [[ -s "$BODY_FILE" ]]; then
            echo "::group::GitHub API response body"
            if jq . "$BODY_FILE" 2>/dev/null; then
              :
            else
              cat "$BODY_FILE"
              echo
            fi
            echo "::endgroup::"
          fi

          case "$HTTP_CODE" in
            204)
              echo "Repository dispatch accepted by GitHub."
              echo "Check the Receive Backend Release workflow in $INFRA_REPOSITORY."
              ;;
            401)
              echo "::error::Authentication failed. Check whether INFRA_DISPATCH_TOKEN is valid, expired, or revoked."
              exit 1
              ;;
            403)
              echo "::error::GitHub denied this request. See the response body and diagnostic headers."
              echo "For a fine-grained PAT, verify:"
              echo "  Resource owner: MessagerTeam"
              echo "  Repository access: MessagerTeam/infra"
              echo "  Repository permissions: Contents - Read and write"
              echo "  Organization approval, if required"
              echo "  INFRA_DISPATCH_TOKEN contains the intended token"
              exit 1
              ;;
            404)
              echo "::error::Repository not found or not accessible to this token: $INFRA_REPOSITORY"
              exit 1
              ;;
            422)
              echo "::error::Validation failed or the endpoint has been spammed. See the API response."
              exit 1
              ;;
            *)
              echo "::error::Unexpected GitHub API response: HTTP $HTTP_CODE"
              exit 1
              ;;
          esac
