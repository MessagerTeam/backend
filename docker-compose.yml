name: messenger-dev

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS is required}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  db-init:
    image: postgres:17
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:?USER_DB_PASSWORD is required}
      CHAT_DB_PASSWORD: ${CHAT_DB_PASSWORD:?CHAT_DB_PASSWORD is required}
    volumes:
      - ./deploy/init-db.sh:/init-db.sh:ro
    entrypoint: ["/bin/sh", "/init-db.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  user-service:
    build:
      context: .
      dockerfile: src/Messenger.User/Dockerfile
    image: messenger/user-service:local
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Jwt__Secret: ${JWT_SECRET:?JWT_SECRET is required}
      Jwt__Issuer: ${JWT_ISSUER:-messenger}
      Jwt__Audience: ${JWT_AUDIENCE:-messenger-api}
      ConnectionStrings__UsersDb: "Host=postgres;Port=5432;Database=messenger_users;Username=user_service;Password=${USER_DB_PASSWORD:?USER_DB_PASSWORD is required}"
    depends_on:
      db-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:5001:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  chat-service:
    build:
      context: .
      dockerfile: src/Messenger.Chat/Dockerfile
    image: messenger/chat-service:local
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Jwt__Secret: ${JWT_SECRET:?JWT_SECRET is required}
      Jwt__Issuer: ${JWT_ISSUER:-messenger}
      Jwt__Audience: ${JWT_AUDIENCE:-messenger-api}
      ConnectionStrings__ChatDb: "Host=postgres;Port=5432;Database=messenger_chat;Username=chat_service;Password=${CHAT_DB_PASSWORD:?CHAT_DB_PASSWORD is required}"
    depends_on:
      db-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:5002:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  realtime-service:
    build:
      context: .
      dockerfile: src/Messenger.Realtime/Dockerfile
    image: messenger/realtime-service:local
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Jwt__Secret: ${JWT_SECRET:?JWT_SECRET is required}
      Jwt__Issuer: ${JWT_ISSUER:-messenger}
      Jwt__Audience: ${JWT_AUDIENCE:-messenger-api}
    ports:
      - "127.0.0.1:5003:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: src/Messenger.Gateway/Dockerfile
    image: messenger/gateway:local
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Jwt__Secret: ${JWT_SECRET:?JWT_SECRET is required}
      Jwt__Issuer: ${JWT_ISSUER:-messenger}
      Jwt__Audience: ${JWT_AUDIENCE:-messenger-api}
      Cors__AllowedOrigins__0: http://localhost:8081
      Cors__AllowedOrigins__1: http://localhost:19006
    depends_on:
      user-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy
      realtime-service:
        condition: service_healthy
    ports:
      - "127.0.0.1:5000:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  pg_data:
  rabbitmq_data:
